[package]
name = "subagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
ratatui = { version = "0.30.2", features = ["all-widgets"] }
reqwest = { version = "0.13.5", features = ["form", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }
